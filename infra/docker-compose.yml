services:
  vault:
    image: "vault:app"
    container_name: vault
    build: ./vault/.
    hostname: vault 
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - vault_database:/vault/
      - ./.global.env:/.global.env
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: always
