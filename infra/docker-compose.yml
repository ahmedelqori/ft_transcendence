version: '3.8'
volumes:
  shared:
  # profile_images:
  # VolumeVault:
  # user_managment_database:
  # friendship_database:
  # 2fa_database:
  # notification_database:
 
networks:
  appNet:
    driver: bridge

services:
  elasticsearch:
    image: "elasticsearch:app"
    container_name: elasticsearch
    build: ./elk/elasticsearch/
    restart: always
    environment:
      - ES_JAVA_OPTS=-Xmx256m -Xms256m
      - discovery.type=single-node
    networks:
      - appNet
    volumes:
      - shared:/shared

  logstash:
    image: "logstash:app"
    container_name: logstash
    build: ./elk/logstash/
    restart: always
    volumes:
      - ./elk/logs/fastify.log:/var/log/fastify/fastify.log
    depends_on:
      - elasticsearch
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    networks:
      - appNet

  kibana:
    image: "kibana:app"
    container_name: kibana
    build: ./elk/kibana/
    restart: always
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - appNet
    volumes:
      - shared:/shared


  nginx-modsecurity:
    image: "nginx-modsecurity:app"
    container_name: nginx-modsecurity
    build: ./nginx-modsecurity/.
    ports:
      - "443:443"
    networks:
      - appNet
    restart: always
