volumes:
  vault_database:
  temp_env:
  framework_build:
  user_managment_database:
  profile_images:
  friendship_database:
  2fa_database:
  notification_database:
  tournament_database:
  chatlive_database:
  game_database:

networks:
  appNet:
    driver: bridge

services:
  vault:
    container_name: vault
    build: ./vault/.
    env_file:
      - ./.global.env
    ports:
      - "8200:8200"
    networks:
      - appNet
    volumes:
      - vault_database:/vault/data
      - temp_env:/home/vault
    cap_add:
      - IPC_LOCK
    
  nginx-modsecurity:
    container_name: nginx-modsecurity
    build: ./nginx-modsecurity/.
    ports:
      - "8081:443"
    networks:
      - appNet
    restart: always
    env_file:
      - ./uccello/app/.env
    volumes:
      - profile_images:/app/profile_images
      - framework_build:/var/www/html
    depends_on:
      - vault

  # uccello:
  #   build:
  #     context: ./uccello
  #     dockerfile: Dockerfile
  #   container_name: uccello
  #   env_file:
  #     - ./uccello/app/.env
  #   networks:
  #     - appNet
  #   volumes:
  #     - framework_build:/app/dist

  user_managment:
    build:
      context: ./backend_services/user_managment
      dockerfile: Dockerfile
    container_name: user_managment
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - profile_images:/app/profile_images
      - user_managment_database:/app/database
      - temp_env:/app/temp_env
    depends_on:
      - vault

  2fa:
    build:
      context: ./backend_services/2FA
      dockerfile: Dockerfile
    container_name: 2fa
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - 2fa_database:/app/database
      - temp_env:/app/temp_env
    depends_on:
      - vault
      - user_managment

  friendship:
    build:
      context: ./backend_services/friendship
      dockerfile: Dockerfile
    container_name: friendship
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - friendship_database:/app/database
    depends_on:
      - user_managment

  notification:
    build:
      context: ./backend_services/notification
      dockerfile: Dockerfile
    container_name: notification
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - notification_database:/app/database
    depends_on:
      - user_managment

  tournament:
    build:
      context: ./backend_services/tournament
      dockerfile: Dockerfile
    container_name: tournament
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - tournament_database:/app/database
      - temp_env:/app/temp_env
    depends_on:
      - user_managment
      - vault

  chatlive:
    build:
      context: ./backend_services/chatlive
      dockerfile: Dockerfile
    container_name: chatlive
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - chatlive_database:/app/database
    depends_on:
      - user_managment

  game:
    build:
      context: ./backend_services/game
      dockerfile: Dockerfile
    container_name: game
    env_file:
      - ./.global.env
    networks:
      - appNet
    volumes:
      - game_database:/app/database
    depends_on:
      - user_managment