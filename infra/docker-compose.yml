services:
  nginx-modsecurity:
    image: "nginx-modsecurity:app"
    container_name: nginx-modsecurity
    build: ./nginx-modsecurity/.
    ports:
      - "443:443"
    networks:
      - appNet
    restart: always
    volumes:
      - profile_images:/app/profile_images
  #   depends_on:
  #     - vault

  vault:
    image: "vault:app"
    container_name: vault
    build: ./vault/.
    hostname: vault 
    env_file:
      - ./vault/.env
    networks:
      - appNet
    volumes:
      - VolumeVault:/vault/
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: always

  user_managment:
    build:
      context: ./backend_services/user_managment
      dockerfile: Dockerfile
    container_name: user_managment
    env_file:
      - ./backend_services/user_managment/.env
    networks:
      - appNet
    volumes:
      - profile_images:/app/profile_images
      - user_managment_database:/app/database

  friendship:
    build:
      context: ./backend_services/friendship
      dockerfile: Dockerfile
    container_name: friendship
    env_file:
      - ./backend_services/friendship/.env
    networks:
      - appNet
    volumes:
      - friendship_database:/app/database
    depends_on:
      - user_managment

  2fa:
    build:
      context: ./backend_services/2FA
      dockerfile: Dockerfile
    container_name: 2fa
    env_file:
      - ./backend_services/2FA/.env
    networks:
      - appNet
    volumes:
      - 2fa_database:/app/database
    depends_on:
      - user_managment
  notification:
    build:
      context: ./backend_services/notification
      dockerfile: Dockerfile
    container_name: notification
    env_file:
      - ./backend_services/notification/.env
    networks:
      - appNet
    volumes:
      - notification_database:/app/database
    depends_on:
      - user_managment
  tournament:
    build:
      context: ./backend_services/tournament
      dockerfile: Dockerfile
    container_name: tournament
    env_file:
      - ./backend_services/tournament/.env
    networks:
      - appNet
    volumes:
      - tournament_database:/app/database
    depends_on:
      - user_managment
      
  # chatlive:
  # chatlive:
  #   build:
  #     context: ./backend_services/chatlive
  #     dockerfile: Dockerfile
  #   container_name: chatlive
  #   env_file:
  #     - ./backend_services/chatlive/.env
  #   networks:
  #     - appNet
  #   volumes:
  #     - chatlive_database:/app/database
  #   depends_on:
  #     - user_managment


volumes:
  VolumeVault:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/VolumeVault
      o: bind
  profile_images:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/profile_images
      o: bind
  user_managment_database:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/user_managment_database
      o: bind
  friendship_database:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/friendship_database
      o: bind
  2fa_database:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/2fa_database
      o: bind
  notification_database:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/notification_database
      o: bind
  tournament_database:
    driver: local
    driver_opts:
      type: none
      device: ./infra/volumes/tournament_database
      o: bind
  # chatlive_database:
