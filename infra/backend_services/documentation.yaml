  /api/tournament/:
    post:
      tags:
        - tournaments
      summary: Create a new tournament
      description: |
        Creates a new tournament with the specified name, nickname, and number of players. The number of players must be one of the allowed values (4, 8, or 16).
      operationId: createTournament
      requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournament_name:
                    type: string
                    description: Name of the tournament.
                    example: tournament_1
                  nickname:
                    type: string
                    description: Nickname of the tournament owner.
                    example: 7h3
                  players_number:
                    type: integer
                    description: Number of players in the tournament (must be 4, 8, or 16).
                    example: 16
                required:
                  - tournament_name
                  - nickname
                  - players_number
      responses:
          '201':
            description: Tournament created successfully.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    owner_id:
                      type: integer
                      description: ID of the tournament owner.
                      example: 22
                    tournament_name:
                      type: string
                      description: Name of the tournament.
                      example: tournament_1
                    players_number:
                      type: integer
                      description: Number of players in the tournament.
                      example: 16
                    id:
                      type: integer
                      description: ID of the created tournament.
                      example: 6
          '400':
            description: Invalid number of players.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      example: You can only create a tournament with 4, 8, or 16 players.
