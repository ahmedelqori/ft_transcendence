      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
                file:
                  contentType: image/jpeg, image/png, image/gif, image/webp
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
                    example: https://pingpong.ma/profile_images/ybouchmaAA.png
        '400':
          description: Invalid input
