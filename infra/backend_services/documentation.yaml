                  example: ybouchmaAA
                first_name:
                  type: string
                  example: Youssef
                last_name:
                  type: string
                  example: Bouchmama
                bio:
                  type: string
                  example: "one two three viva algerie"
                status:
                  type: string
                  example: ON
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
