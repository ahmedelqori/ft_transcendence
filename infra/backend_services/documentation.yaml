  /api/friends/{user_id}/friend:
    delete:
      tags:
        - friendship
      summary: Remove friend (still not complete)
      security:
        - bearerAuth: []
      operationId: removeFriend
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend removed
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/friends/{user_id}/block:
    post:
      tags:
        - friendship
      summary: Block user (still not complete)
      security:
