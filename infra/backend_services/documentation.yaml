                properties:
                  id:
                    type: integer
                    example: 1
                  username:
                    type: string
                    example: ybouchmaAA
                  first_name:
                    type: string
                    example: Youssef
                  last_name:
                    type: string
                    example: Bouchmama
                  bio:
                    type: string
                    example: "one two three viva algerie"
