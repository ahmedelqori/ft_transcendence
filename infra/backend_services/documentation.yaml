          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/friends/search:
    get:
      tags:
        - friendship
      summary: Search friends (still not complete)
      security:
        - bearerAuth: []
      operationId: searchFriends
      responses:
