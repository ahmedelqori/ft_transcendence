                    example: 0
                  created_at:
                    type: string
                    format: date-time
                    example: 2025-03-13T07:19:20.993Z
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

  /api/account/avatar/:
