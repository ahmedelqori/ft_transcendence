        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/friends/{user_id}/friend:
    delete:
      tags:
        - friendship
      summary: Remove friend
      security:
        - bearerAuth: []
      operationId: removeFriend
      parameters:
        - name: user_id
          in: path
          required: true
