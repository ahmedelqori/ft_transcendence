          schema:
            type: string
      responses:
        '200':
          description: Friend request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: Request rejected
        '404':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request not found
        '400':
          description: Invalid user_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
