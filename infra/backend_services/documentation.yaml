openapi: 3.0.3
info:
  title: ft_transcendence
  description: |-
    ft_transcendence is the final project of the 42 curriculum. It is a full-stack web application where you build a real-time multiplayer Pong game with additional features. The goal is to combine backend, frontend, and real-time communication using modern web technologies.
    
    Some useful links:
    - [School subject](https://cdn.intra.42.fr/pdf/pdf/150371/en.subject.pdf)
    - [github](https://github.com/7h3Y055)
  termsOfService: http://swagger.io/terms/
  contact:
    email: youssefbouchmama@hotmail.com
  license:
    name: Licens
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11

servers:
  - url: https://pingpong.ma/

tags:
  - name: account
    description: Operations about user account managments
      
  - name: friendship
    description: Operations about user friendships
      
  - name: 2fa
    description: Operations about user 2fa
    
  - name: notifications
    description: Operations about user notifications

  - name: tournaments
    description: Operations about tournaments

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/account/login/{provider}/:
    get:
      tags:
        - account
      summary: 42/google login
      operationId: googleLogin
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: JWT.TOKEN.TEST
                  refresh_token:
                    type: string
                    example: JWT.TOKEN.TEST
        '400':
          description: Invalid input
        '500':
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - 42
  /api/account/login/refresh/:
    post:
      tags:
        - account
      summary: Refresh JWT tokens
      security:
        - bearerAuth: []
      operationId: refreshLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: JWT.TOKEN.TEST
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: JWT.TOKEN.TEST
                  refresh_token:
                    type: string
                    example: JWT.TOKEN.TEST
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/account/whoami/:
    get:
      tags:
        - account
      summary: Get current user
      security:
        - bearerAuth: []
      operationId: whoAmI
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  username:
                    type: string
                    example: ybouchma
                  first_name:
                    type: string
                    example: Youssef
                  last_name:
                    type: string
                    example: Bouchmama
                  bio:
                    type: string
                    example: "one two three viva algerie"
                  avatar_url:
                    type: string
                    example: https://pingpong.ma/profile_images/ybouchma.jpg
                  status:
                    type: string
                    example: ON
                  two_FA:
                    type: integer
                    example: 0
                  created_at:
                    type: string
                    format: date-time
                    example: 2025-03-13T07:19:20.993Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

  /api/account/update-profile/:
    patch:
      tags:
        - account
      summary: Update user profile
      security:
        - bearerAuth: []
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: ybouchmaAA
                first_name:
                  type: string
                  example: Youssef
                last_name:
                  type: string
                  example: Bouchmama
                bio:
                  type: string
                  example: "one two three viva algerie"
                status:
                  type: string
                  example: ON
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  username:
                    type: string
                    example: ybouchmaAA
                  first_name:
                    type: string
                    example: Youssef
                  last_name:
                    type: string
                    example: Bouchmama
                  bio:
                    type: string
                    example: "one two three viva algerie"
                  avatar_url:
                    type: string
                    example: https://pingpong.ma/profile_images/ybouchma.jpg
                  status:
                    type: string
                    example: ON
                  two_FA:
                    type: integer
                    example: 0
                  created_at:
                    type: string
                    format: date-time
                    example: 2025-03-13T07:19:20.993Z
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

  /api/account/avatar/:
    post:
      tags:
        - account
      summary: Upload avatar
      security:
        - bearerAuth: []
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
                file:
                  contentType: image/jpeg, image/png, image/gif, image/webp
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
                    example: https://pingpong.ma/profile_images/ybouchmaAA.png
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid file type
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/account/search/:
    get:
      tags:
        - account
      summary: Search users
      security:
        - bearerAuth: []
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        username:
                          type: string
                          example: ybouchmaAA
                        first_name:
                          type: string
                          example: Youssef
                        last_name:
                          type: string
                          example: Bouchmama
                        bio:
                          type: string
                          example: "one two three viva algerie"
                        avatar_url:
                          type: string
                          example: https://pingpong.ma/profile_images/ybouchmaAA.png
                        status:
                          type: string
                          example: ON
                        created_at:
                          type: string
                          format: date-time
                          example: 2025-03-13T07:19:20.993Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid parameters
  /api/account/{id}:
    get:
      tags:
        - account
      summary: Get user by ID
      security:
        - bearerAuth: []
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  username:
                    type: string
                    example: ybouchmaAA
                  first_name:
                    type: string
                    example: Youssef
                  last_name:
                    type: string
                    example: Bouchmama
                  bio:
                    type: string
                    example: "one two three viva algerie"
                  avatar_url:
                    type: string
                    example: https://pingpong.ma/profile_images/ybouchmaAA.png
                  status:
                    type: string
                    example: ON
                  created_at:
                    type: string
                    format: date-time
                    example: 2025-03-13T07:19:20.993Z
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User not found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/account/users/:
    get:
      tags:
        - account
      summary: Get all users
      security:
        - bearerAuth: []
      operationId: getAllUsers
      parameters:
        - name: n
          in: query
          required: true
          schema:
            type: integer
            example: 5
        - name: sort
          in: query
          required: true
          schema:
            type: string
            enum:
              - newest
              - oldest
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    username:
                      type: string
                      example: ybouchmaAA
                    email:
                      type: string
                      example: ybouchma@student.1337.ma
                    first_name:
                      type: string
                      example: Youssef
                    last_name:
                      type: string
                      example: Bouchmama
                    bio:
                      type: string
                      example: "one two three viva algerie"
                    avatar_url:
                      type: string
                      example: https://pingpong.ma/profile_images/ybouchmaAA.png
                    status:
                      type: string
                      example: ON
                    two_FA:
                      type: integer
                      example: 0
                    created_at:
                      type: string
                      format: date-time
                      example: 2025-03-13T07:19:20.993Z
        '400':
          description: Invalid sort parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid sort parameter
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized











  /api/notif/:
    get:
      tags:
        - notifications
      summary: Get all notifications
      security:
        - bearerAuth: []
      operationId: getAllNotifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        level:
                          type: string
                          example: info
                        message:
                          type: string
                          example: one two three viva la algerie
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
    delete:
      tags:
        - notifications
      summary: Delete all notifications
      security:
        - bearerAuth: []
      operationId: deleteAllNotifications
      responses:
        '204':
          description: All notifications deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Marked 5 notifications as read
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/notif/{id}:
    delete:
      tags:
        - notifications
      summary: Delete notification by ID
      security:
        - bearerAuth: []
      operationId: deleteNotificationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: mark notification as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Marked 1 notifications as read
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Notification not found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/notif/ws:
    get:
      tags:
        - notifications
      summary: WebSocket for notifications
      security:
        - bearerAuth: []
      operationId: notificationsWebSocket
      responses:
        '101':
          description: Switching protocols
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized







  /api/friends/{user_id}/request:
    post:
      tags:
        - friendship
      summary: Send friend request (still not complete)
      security:
        - bearerAuth: []
      operationId: sendFriendRequest
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend request sent
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
    delete:
      tags:
        - friendship
      summary: Cancel friend request (still not complete)
      security:
        - bearerAuth: []
      operationId: cancelFriendRequest
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend request canceled
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
          content:
