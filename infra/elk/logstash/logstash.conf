# Input: Read logs from the shared volume
input {
  file {
    path => "/var/log/fastify/fastify.log"  # Path to your log file in the shared volume
    start_position => "beginning"           # Start reading from the beginning of the file
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Convert timestamp to proper format
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  if [details] {
    if [details][email] {
      mutate {
        add_field => { "email" => "%{[details][email]}" }
      }
    }
    if [details][ip] {
      mutate {
        add_field => { "ip" => "%{[details][ip]}" }
      }
    }
    if [details][userAgent] {
      mutate {
        add_field => { "userAgent" => "%{[details][userAgent]}" }
      }
    }
    if [details][status] {
      mutate {
        add_field => { "status" => "%{[details][status]}" }
      }
    }
  }

  uuid {
    target => "[@metadata][uuid]"
  }
  
  mutate {
    remove_field => ["details"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fastify-logs-%{+YYYY.MM.dd}-%{level}"  # Index based on log level
    document_id => "%{[@metadata][uuid]}"
    user => "elastic"  # Replace with your username
    password => "changeme"  # Replace with your password
  }
}