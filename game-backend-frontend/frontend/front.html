<!DOCTYPE html>
<html>
<head>
  <title>Socket.IO Game Test</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <style>
    body { 
      margin: 20px; 
      font-family: Arial, sans-serif; 
      display: flex;
      flex-direction: column;
    }
    
    .container {
      display: flex;
      gap: 20px;
    }
    
    .left-panel {
      flex: 1;
    }
    
    .right-panel {
      flex: 1;
    }
    
    #events { 
      height: 300px; 
      border: 1px solid #ccc; 
      overflow-y: scroll; 
      margin-bottom: 10px; 
      padding: 10px; 
    }
    
    #controls { 
      margin-bottom: 20px; 
    }
    
    button { 
      margin-right: 5px; 
    }
    
    pre { 
      margin: 0; 
    }
    
    #gameCanvas {
      border: 2px solid #333;
      background-color: #222;
      margin-top: 10px;
      cursor: none;
    }
    
    .game-controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    
    .scoreboard {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }
    
    .game-status {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Socket.IO Pong Game</h1>
  
  <div class="container">
    <div class="left-panel">
      <div id="controls">
        <input id="gameId" type="text" placeholder="Game ID" value="1">
        <input id="userId" type="text" placeholder="User Id" value="1">
        <button id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
      </div>
      
      <div id="events">
        <div>Events will appear here...</div>
      </div>
      
      <div>
        <button id="joinGame">joinGame</button>
        <button id="startGame">startGame</button>
        <button id="paddleMove">paddleMove (random)</button>
        <button id="pauseGame">pauseGame</button>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="scoreboard">
        <div>Player 1: <span id="score1">0</span></div>
        <div>Player 2: <span id="score2">0</span></div>
      </div>
      
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      
      <div class="game-status" id="gameStatus"></div>
    </div>
  </div>
  
  <script>
    // Game variables
    let socket;
    let gameConfig = {
        playersNumber: 2,
        ballSpeed: 5,
        maxBallSpeed: 10,
        ballSize: 10,
        paddleWidth: 100,
        paddleHeight: 10,
        paddleSpeed: 10,
        boardWidth: 800,
        boardHeight: 600,
        scoreToWin: 10,
    };
    let playerType = null;
    let gameState = {
      ball: { x: gameConfig.boardWidth/2, y: gameConfig.boardHeight/2 },
      paddles: { up: gameConfig.boardWidth/2, down: gameConfig.boardWidth/2 },
      score: { mainPlayer: 0, secondPlayer: 0 },
      boardWidth: gameConfig.boardWidth,          
      boardHeight: gameConfig.boardHeight,  
      inProgress: false,
      ended: false,
      winner: null
    };
    let gameStarted = false;
    let lastPaddlePosition = null;

    // Keyboard control variables
    let keyState = {
      a: false,
      d: false
    };
    let paddlePosition = gameConfig.boardWidth/2; // Store paddle position locally
    
    // Canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Function to log events
    function log(type, message) {
      const eventsDiv = document.getElementById('events');
      const now = new Date().toISOString().substr(11, 8);
      const entry = document.createElement('div');
      
      if (typeof message === 'object') {
        entry.innerHTML = `<pre>[${now}] ${type}: ${JSON.stringify(message, null, 2)}</pre>`;
      } else {
        entry.textContent = `[${now}] ${type}: ${message}`;
      }
      
      if (type === 'error') {
        entry.style.color = 'red';
      } else if (type === 'emit') {
        entry.style.color = 'blue';
      } else if (type === 'receive') {
        entry.style.color = 'green';
      }
      
      eventsDiv.appendChild(entry);
      eventsDiv.scrollTop = eventsDiv.scrollHeight;
    }
    
    // Function to render the game
    function renderGame() {
      // Clear canvas
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw center line
      ctx.strokeStyle = '#555';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Draw paddles
      ctx.fillStyle = '#FFF';
      
      // Top paddle (player 2)
      ctx.fillRect(
        gameState.paddles.up - (gameConfig.paddleWidth / 2),
        10,
        gameConfig.paddleWidth,
        gameConfig.paddleHeight
      );
      
      // Bottom paddle (player 1)
      ctx.fillRect(
        gameState.paddles.down - (gameConfig.paddleWidth / 2),
        canvas.height - 20,
        gameConfig.paddleWidth,
        gameConfig.paddleHeight
      );
      
      // Draw ball
      ctx.beginPath();
      ctx.arc(
        gameState.ball.x,
        gameState.ball.y,
        gameConfig.ballSize / 2,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = '#FFF';
      ctx.fill();
      ctx.closePath();
      
      // Update scoreboard
      document.getElementById('score1').textContent = gameState.score.mainPlayer;
      document.getElementById('score2').textContent = gameState.score.secondPlayer;
      
      // Update game status
      if (gameState.ended) {
        const winner = gameState.winner === 'mainPlayer' ? 'Player 1' : 'Player 2';
        document.getElementById('gameStatus').textContent = `Game Over! ${winner} wins!`;
        document.getElementById('gameStatus').style.color = '#4CAF50';
      } else if (gameStarted) {
        document.getElementById('gameStatus').textContent = 'Game in progress';
        document.getElementById('gameStatus').style.color = '#2196F3';
      } else {
        document.getElementById('gameStatus').textContent = 'Waiting for game to start';
        document.getElementById('gameStatus').style.color = '#FF9800';
      }
      
      // Request next frame
      requestAnimationFrame(renderGame);
    }
    
    // Start rendering loop
    renderGame();
    
    // Game loop for paddle movement
    // Game loop for paddle movement
function gameLoop() {
  if (gameStarted && !gameState.ended && socket?.connected && playerType) {
    // Start with current position
    let currentPosition;
    
    if (playerType === 'mainPlayer') {
      currentPosition = gameState.paddles.down;
    } else {
      currentPosition = gameState.paddles.up;
    }
    
    // Store original position to detect movement
    const originalPosition = currentPosition;
    
    // Update paddle position based on key state
    if (keyState.a) {
      currentPosition -= gameConfig.paddleSpeed;
    }
    if (keyState.d) {
      currentPosition += gameConfig.paddleSpeed;
    }
    
    // Keep paddle within bounds
    currentPosition = Math.max(gameConfig.paddleWidth / 2, 
                   Math.min(canvas.width - gameConfig.paddleWidth / 2, currentPosition));
    
    // Only send if the position changed
    if (currentPosition !== originalPosition) {
        if (playerType === 'mainPlayer') {
          gameState.paddles.down = currentPosition;
        } else {
          gameState.paddles.up = currentPosition;
        }
      socket.emit('paddleMove', currentPosition);
            
      // Store last position
      lastPaddlePosition = currentPosition;
    }
  }
  
  requestAnimationFrame(gameLoop);
}
    
    // Start game loop
    gameLoop();
    
    // Keyboard event listeners
    document.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'a') {
        console.log('A key pressed, keyState:', keyState);
        keyState.a = true;
      }
      if (event.key.toLowerCase() === 'd'){ 
        console.log('D key pressed, keyState:', keyState);
        keyState.d = true};
    });
    
    document.addEventListener('keyup', (event) => {
      if (event.key.toLowerCase() === 'a') keyState.a = false;
      if (event.key.toLowerCase() === 'd') keyState.d = false;
    });
    
    // Connect button
    document.getElementById('connect').addEventListener('click', () => {
      const gameId = document.getElementById('gameId').value;
      const userId = document.getElementById('userId').value;
      
      if (socket) {
        socket.disconnect();
      }
      
      log('info', `Connecting to socket with gameId=${gameId}, userId=${userId}`);
      
      // Create socket connection
      socket = io("http://localhost:3000/socket/game", {
        transports: ["websocket"],
        auth: {
          gameId: gameId,
          userId: userId
        }
      });
      
      // Setup listeners
      socket.on('connect', () => {
        log('info', 'Connected to server');
      });
      
      socket.on('disconnect', () => {
        log('info', 'Disconnected from server');
        gameStarted = false;
      });
      
      socket.on('connect_error', (err) => {
        log('error', `Connection error: ${err.message}`);
      });
      
      // Game specific events
      socket.on('initGame', (data) => {
        log('receive', data);
        if (data.gameConfig && data.gameState) {
          gameConfig = data.gameConfig;
          gameState = data.gameState;
        }
      });
      
      socket.on('joinedGame', (data) => {
        log('receive', data);
        playerType = data.playerType;
        log('info', `You are playing as ${playerType}`);
        
        document.getElementById('gameStatus').textContent = 'Joined game, waiting for opponent';
      });
      
      socket.on('playerJoined', (data) => {
        log('receive', data);
        document.getElementById('gameStatus').textContent = 'Opponent joined, ready to start';
      });
      
      socket.on('readyToStart', (data) => {
        log('receive', data);
        document.getElementById('gameStatus').textContent = 'Game ready! Press Start Game to begin';
      });
      
      socket.on('gameStarted', () => {
        log('receive', 'Game started');
        gameStarted = true;
        gameState.ended = false;
        gameState.winner = null;
        document.getElementById('gameStatus').textContent = 'Game in progress';
      });
      
      socket.on('gameStateUpdate', (data) => {
        // Update without logging every frame to avoid console spam
        gameState = data;
      });
      
      socket.on('gameOver', (data) => {
        log('receive', data);
        gameStarted = false;
        gameState.ended = true;
        gameState.winner = data.winner;
        
        const winnerText = data.winner === 'mainPlayer' ? 'Player 1' : 'Player 2';
        document.getElementById('gameStatus').textContent = `Game Over! ${winnerText} wins!`;
      });
      
      socket.on('playerDisconnected', (data) => {
        log('receive', data);
        document.getElementById('gameStatus').textContent = 'Opponent disconnected!';
      });
      
      socket.on('gameError', (data) => {
        log('error', data);
      });
    });
    
    // Disconnect button
    document.getElementById('disconnect').addEventListener('click', () => {
      if (socket) {
        socket.disconnect();
        log('info', 'Manually disconnected');
        gameStarted = false;
      }
    });
    
    // Game events
    document.getElementById('joinGame').addEventListener('click', () => {
      if (socket && socket.connected) {
        socket.emit('joinGame');
        log('emit', 'joinGame event sent');
      } else {
        log('error', 'Not connected');
      }
    });
    
    document.getElementById('startGame').addEventListener('click', () => {
      if (socket && socket.connected) {
        socket.emit('startGame');
        log('emit', 'startGame event sent');
      } else {
        log('error', 'Not connected');
      }
    });
    
    // document.getElementById('paddleMove').addEventListener('click', () => {
    //   if (socket && socket.connected) {
    //     const position = Math.floor(Math.random() * canvas.width);
    //     socket.emit('paddleMove', position);
    //     log('emit', `paddleMove event sent with position: ${position}`);
    //   } else {
    //     log('error', 'Not connected');
    //   }
    // });
    
    document.getElementById('pauseGame').addEventListener('click', () => {
      if (socket && socket.connected) {
        socket.emit('pauseGame');
        log('emit', 'pauseGame event sent');
        gameStarted = false;
      } else {
        log('error', 'Not connected');
      }
    });
  </script>
</body>
</html>
