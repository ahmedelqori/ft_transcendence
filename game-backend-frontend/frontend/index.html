<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
    }
    
    #gameCanvas {
      background: black;
      display: block;
      margin: 20px auto;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    
    .control-panel {
      margin: 20px auto;
      max-width: 600px;
      padding: 15px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }
    
    .game-controls button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    
    #connectBtn {
      background-color: #4CAF50;
      color: white;
    }
    
    #disconnectBtn {
      background-color: #f44336;
      color: white;
      display: none;
    }
    
    #pauseBtn {
      background-color: #FF9800;
      color: white;
      display: none;
    }
    
    #cancelBtn {
      background-color: #9E9E9E;
      color: white;
      display: none;
    }
    
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      background-color: #e8e8e8;
      min-height: 20px;
    }
    
    .game-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .score {
      font-size: 24px;
      font-weight: bold;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .pause-btn {
      background-color: #FF9800;
      color: white;
    }
    
    .resume-btn {
      background-color: #4CAF50;
      color: white;
    }
    
    #pauseBtn {
      transition: background-color 0.3s;
    }
  </style>
</head>
<body>
  <h1>Pong Game</h1>
  
  <div class="control-panel">
    <div class="game-controls">
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
      <button id="pauseBtn">Pause</button>
      <button id="cancelBtn">Cancel Game</button>
    </div>
    
    <div class="game-info">
      <div class="player-info">You: <span id="playerType">-</span></div>
      <div class="score">
        <span id="scoreLeft">0</span> : <span id="scoreRight">0</span>
      </div>
      <div class="state">State: <span id="gameState">Disconnected</span></div>
    </div>
    
    <div class="status" id="statusMessage">
      Please connect to start
    </div>
  </div>
  
  <canvas id="gameCanvas" width="600" height="450"></canvas>
  
  <script type="module" src="index.js"></script>
</body>
</html>
