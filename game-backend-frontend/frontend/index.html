<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Pong Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Socket.IO Pong Game</h1>
  </header>
  
  <div class="container">
    <div class="left-panel">
      <div class="connection-controls">
        <div class="input-group">
          <input id="gameId" type="text" placeholder="Game ID" value="1">
          <input id="userId" type="text" placeholder="User Id" value="1">
        </div>
        <div class="button-group">
          <button id="connect">Connect</button>
          <button id="disconnect">Disconnect</button>
        </div>
      </div>
      
      <div class="event-log">
        <h3>Event Log</h3>
        <div id="events">
          <div>Events will appear here...</div>
        </div>
      </div>
      
      <div class="game-controls">
        <button id="joinGame">Join Game</button>
        <button id="startGame">Start Game</button>
        <button id="pauseGame">Pause Game</button>
        <button id="cancelGame">Cancel Game</button>
      </div>
      
      <div class="input-controls">
        <label>
          <input type="checkbox" id="useMouseControl" checked> Use Mouse Control
        </label>
        <div class="key-instructions">
          <p>Use 'W' and 'S' keys to move paddle up and down</p>
        </div>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="scoreboard">
        <div class="score">Player 1: <span id="score1">0</span></div>
        <div class="score">Player 2: <span id="score2">0</span></div>
      </div>
      
      <div class="game-canvas-container">
        <canvas id="gameCanvas"></canvas>
      </div>
      
      <div class="game-status" id="gameStatus"></div>
    </div>
  </div>
  
  <script type="module" src="index.js"></script>
</body>
</html>
