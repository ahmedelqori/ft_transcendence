<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="scoreboard">
            <div class="player-info">
                <div class="player-avatar top-player-avatar"></div>
                <div class="player-name" id="player-one-name">Player 1</div>
            </div>
            
            <div class="score">
                <span id="top-score">0</span>
                <span class="score-separator">-</span>
                <span id="bottom-score">0</span>
            </div>
            
            <div class="player-info">
                <div class="player-name" id="player-two-name">Player 2</div>
                <div class="player-avatar bottom-player-avatar"></div>
            </div>
        </div>
        
        <div class="game-board" id="game-board">
            <div class="paddle top-paddle" id="top-paddle"></div>
            <div class="ball" id="ball"></div>
            <div class="center-circle"></div>
            <div class="center-line"></div>
            <div class="paddle bottom-paddle" id="bottom-paddle"></div>
            
            <div class="game-over" id="game-over">
                <h2 id="winner-text">Game Over</h2>
                <button id="restart-button">Play Again</button>
            </div>
        </div>
        
        <div class="status" id="status">Waiting for connection...</div>
        <div class="controls">
            <button id="start-button">Start Game</button>
            <button id="join-button">invite Game</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js" integrity="sha384-c79GN5VsunZvi+Q/WObgk2in0CbZsHnjEqvFxC5DxHn9lTfNce2WW6h2pH6u/kF+" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
