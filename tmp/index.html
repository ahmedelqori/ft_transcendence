<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Pong Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: black;
        overflow: hidden;
      }

      .game-container {
        width: 800px;
        height: 400px;
        display: flex;
        justify-content: space-between;
        position: relative;
      }

      .paddle {
        width: 15px;
        height: 100px;
        background-color: white;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
      }

      #left-paddle {
        left: 0;
      }

      #right-paddle {
        right: 0;
      }

      .ball {
        width: 15px;
        height: 15px;
        background-color: white;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="paddle" id="left-paddle"></div>
      <div class="paddle" id="right-paddle"></div>
      <div class="ball" id="ball"></div>
    </div>

    <script>
      const leftPaddle = document.getElementById("left-paddle");
      const rightPaddle = document.getElementById("right-paddle");
      const ball = document.getElementById("ball");
      const gameContainer = document.querySelector(".game-container");
      let leftPaddleY = 150;
      let rightPaddleY = 150;
      let ballX = 390;
      let ballY = 195;
      let ballSpeedX = 3;
      let ballSpeedY = 2;
      const paddleSpeed = 2;
      const ballSpeed = 3;

      // Left paddle follows the ball smoothly
      function moveLeftPaddle() {
        if (ballY < leftPaddleY + 50) {
          leftPaddleY -= paddleSpeed;
        } else if (ballY > leftPaddleY + 50) {
          leftPaddleY += paddleSpeed;
        }

        // Ensure the paddle stays within the container
        leftPaddleY = Math.max(
          0,
          Math.min(
            leftPaddleY,
            gameContainer.offsetHeight - leftPaddle.offsetHeight
          )
        );
        leftPaddle.style.top = `${leftPaddleY}px`;
      }

      // Right paddle follows the ball with a smooth delay
      function moveRightPaddle() {
        // Smooth movement toward the ball with a delay
        if (ballY < rightPaddleY + 50) {
          rightPaddleY -= paddleSpeed;
        } else if (ballY > rightPaddleY + 50) {
          rightPaddleY += paddleSpeed;
        }

        // Optional: Add randomness for right paddle to slow down its reaction
        if (Math.random() > 0.8) {
          // 20% chance to adjust the movement further for randomness
          rightPaddleY += Math.random() > 0.5 ? paddleSpeed : -paddleSpeed;
        }

        // Ensure the paddle stays within the container
        rightPaddleY = Math.max(
          0,
          Math.min(
            rightPaddleY,
            gameContainer.offsetHeight - rightPaddle.offsetHeight
          )
        );
        rightPaddle.style.top = `${rightPaddleY}px`;
      }

      // Ball movement and collision with paddles
      function moveBall() {
        ballX += ballSpeedX;
        ballY += ballSpeedY;

        // Ball collision with top and bottom of the container
        if (
          ballY <= 0 ||
          ballY >= gameContainer.offsetHeight - ball.offsetHeight
        ) {
          ballSpeedY = -ballSpeedY; // Reverse the vertical direction
        }

        // Ball collision with left paddle
        if (
          ballX <= leftPaddle.offsetWidth &&
          ballY >= leftPaddleY &&
          ballY <= leftPaddleY + leftPaddle.offsetHeight
        ) {
          ballSpeedX = -ballSpeedX; // Reverse the horizontal direction
        }

        // Ball collision with right paddle
        if (
          ballX >=
            gameContainer.offsetWidth -
              rightPaddle.offsetWidth -
              ball.offsetWidth &&
          ballY >= rightPaddleY &&
          ballY <= rightPaddleY + rightPaddle.offsetHeight
        ) {
          ballSpeedX = -ballSpeedX; // Reverse the horizontal direction
        }

        // Ball reset when it goes past the paddles (it will just appear at the center)
        if (
          ballX <= 0 ||
          ballX >= gameContainer.offsetWidth - ball.offsetWidth
        ) {
          ballX = 390; // Reset position
          ballY = 195;
        }

        ball.style.left = `${ballX}px`;
        ball.style.top = `${ballY}px`;
      }

      // Update the game every 16ms (60fps)
      function gameLoop() {
        moveLeftPaddle(); // Move left paddle
        moveRightPaddle(); // Move right paddle
        moveBall(); // Move ball
        requestAnimationFrame(gameLoop);
      }

      // Start the game loop
      gameLoop();
    </script>
  </body>
</html>
