  user_managment_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/db_data/user_managment_database
  profile_images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/profile_images
