services:
  user_managment:
    build:
      context: ./backend/backend_services/user_managment
      dockerfile: Dockerfile
    container_name: user_managment
    env_file:
      - ./backend/backend_services/user_managment/.env
    ports:
      - "3000:3000"
    volumes:
      - profile_images:/app/profile_images
      - user_managment_database:/app/database

  friendship:
    build:
      context: ./backend/backend_services/friendship
      dockerfile: Dockerfile
    container_name: friendship
    env_file:
      - ./backend/backend_services/friendship/.env
    ports:
      - "3001:3000"
    volumes:
      - friendship_database:/app/database

  2fa:
    build:
      context: ./backend/backend_services/2FA
      dockerfile: Dockerfile
    container_name: 2fa
    env_file:
      - ./backend/backend_services/2FA/.env
    ports:
      - "3002:3000"
    volumes:
      - 2fa_database:/app/database

  notification:
    build:
      context: ./backend/backend_services/notification
      dockerfile: Dockerfile
    container_name: notification
    env_file:
      - ./backend/backend_services/notification/.env
    ports:
      - "3003:3000"
    volumes:
      - notification_database:/app/database


volumes:
  user_managment_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/db_data/user_managment_database

  friendship_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/db_data/friendship_database

  2fa_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/db_data/2FA_database

  notification_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/db_data/notification_database

  profile_images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yoss/ft_transcendence/others/profile_images